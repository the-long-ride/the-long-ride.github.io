name: Refresh portfolio metadata

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh public GitHub snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run metadata:refresh

      - name: Commit only a real metadata change
        shell: bash
        run: |
          if git diff --quiet -- src/data/github-snapshot.json; then
            echo "Metadata snapshot is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/github-snapshot.json
          git commit -m "chore: refresh portfolio metadata"
          git push origin HEAD:main
