name: Portfolio CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**"]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Bootstrap lockfile when the branch does not have one yet
        id: lockfile
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            npm install --package-lock-only --ignore-scripts
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit generated lockfile to feature branch
        if: steps.lockfile.outputs.created == 'true' && github.event_name == 'push' && github.ref != 'refs/heads/main'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: add npm lockfile"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify site
        run: npm run verify
